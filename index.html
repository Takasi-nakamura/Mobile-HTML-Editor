<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1117"><meta name="description" content="CodeMirror 6 ベースのモバイルHTMLエディター"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"><title>Mobile HTML Editor</title></head><body><header class="topbar"><div class="brand"><span class="logo">&lt;/&gt;</span><span>HTML Editor</span></div><div class="actions"><button id="installBtn" class="ghost" hidden>インストール</button><button id="exportBtn" class="primary">書き出し</button></div></header><nav class="tabs"><button class="tab active" data-view="editor">エディター</button><button class="tab" data-view="preview">プレビュー</button></nav><main><section id="editorView" class="view active"><div class="subbar"><span id="status">自動保存</span><div><button id="formatBtn" class="small">整形</button><button id="clearBtn" class="small danger">クリア</button></div></div><div id="editor"></div></section><section id="previewView" class="view"><div class="subbar"><span>ライブプレビュー</span><button id="refreshBtn" class="small">更新</button></div><iframe id="preview" title="プレビュー" sandbox="allow-scripts allow-forms allow-modals"></iframe></section></main><div id="exportMenu" class="export-menu" hidden><button id="htmlDownload">HTMLをダウンロード</button><button id="pdfDownload">PDFをダウンロード</button></div><dialog id="pdfDialog"><div class="dialog-body"><strong>PDFを作成中…</strong><p>プレビューをPDFに変換しています。</p><button id="cancelPdf" class="small">閉じる</button></div></dialog><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script type="module" src="./app.js"></script></body></html>
